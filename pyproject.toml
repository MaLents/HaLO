[project]
name = "halo-legibility"
version = "1.0.0"
description = "AI-based handwriting legibility assessment by comparative ranking on the HaLO dataset"
readme = "Readme.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "Meike Bauer" },
    { name = "Marco Lents" },
]
keywords = ["handwriting", "legibility", "ranking", "pairwise-comparison", "bradley-terry"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "torch>=2.0",
    "numpy>=1.24",
    "pandas>=2.0",
    "pymc>=5.0",
    "numpyro>=0.12",
    "scipy>=1.10",
    "scikit-learn>=1.3",
    "einops>=0.6",
    "jaxtyping>=0.2",
    "tqdm>=4.60",
    "tensorboard>=2.14",
    "datasets>=2.14",
    "huggingface_hub>=0.17",
    "krippendorff>=0.6",
    "statsmodels>=0.14",
]

[project.urls]
Dataset = "https://huggingface.co/datasets/MarcoLents/HaLO"
Repository = "https://github.com/MaLents/HaLO"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["halo_legibility*"]
